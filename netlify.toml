[build]
  # No build command needed for static site
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Environment variables (if needed)

[[headers]]
  # Apply these headers to all routes
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/events/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/event/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/courts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/court/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/profile/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/profiles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/post/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/bracket/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/brackets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/scoreboard/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/scoreboards/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  # Cache HTML files for 1 hour
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  # Cache CSS and JS files for 1 year
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache images for 1 year
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache videos for 1 year
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache fonts for 1 year
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API → Firebase Function
[[redirects]]
  from = "/api/share-preview"
  to = "https://us-central1-checkupv2.cloudfunctions.net/getSharePreview"
  status = 200
  force = true

[[redirects]]
  from = "/api/create-square-payment"
  to = "https://us-central1-checkupv2.cloudfunctions.net/createSquarePaymentHttp"
  status = 200
  force = true

# Redirect rules
[[redirects]]
  # Redirect /home to /
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.netlify/functions/apple-app-site-association"
  status = 200
  force = true

[[redirects]]
  from = "/events/:eventId"
