[[redirects]]
  # Unknown-route fallback for shared/deep links
  from = "/*"
  to = "/share-fallback.html"
  status = 200

# Form handling (if forms are added later)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
