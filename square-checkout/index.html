<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout</title>

    <!-- Square Web Payments SDK (Sandbox) - Latest Version -->
    <script src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

    <style>
      :root {
        --bg: #1a1a1a;
        --card-bg: #2a2a2a;
        --card-border: #3a3a3a;
        --text: #ffffff;
        --muted: #a0a0a0;
        --accent: #ff6b35;
        --accent-hover: #ff5722;
        --brown-accent: #8b4513;
        --brown-light: #a0522d;
        --success: #4caf50;
        --error: #f44336;
        --border: #404040;
        --savings: #4caf50;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: grid;
        place-items: center;
      }

      .wrap { width: min(440px, calc(100% - 32px)); }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,.3);
      }

      .title { font-size: 18px; font-weight: 700; margin: 0 0 8px; letter-spacing: .2px; }
      .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.45; }

      .amount {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 16px 20px;
        background: var(--brown-accent);
        border: 1px solid var(--brown-light);
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .amount .label { color: var(--muted); font-size: 13px; }
      .amount .value { font-size: 24px; font-weight: 800; }

      .row { margin-top: 12px; }
      #card-container {
        padding: 14px;
        border-radius: 14px;
        background: #ffffff;
      }

      .payment-selector { margin-top: 20px; }
      
      .selector-tabs {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }
      
      .tab-button {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--text);
        font-family: inherit;
        min-height: 60px;
        position: relative;
        text-align: left;
      }
      
      .tab-button:hover {
        background: rgba(255,255,255,0.05);
        color: var(--text);
      }
      
      .tab-button.active {
        background: var(--brown-accent);
        color: #fff;
        border-color: var(--brown-light);
      }
      
      .tab-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: rgba(255,255,255,0.1);
        flex-shrink: 0;
      }
      
      .tab-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      
      .tab-label {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.2;
      }
      
      .tab-subtitle {
        font-size: 13px;
        color: var(--muted);
        font-weight: 400;
      }
      
      .tab-radio {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-radius: 50%;
        position: relative;
        flex-shrink: 0;
      }
      
      .tab-button.active .tab-radio {
        border-color: var(--accent);
      }
      
      .tab-button.active .tab-radio::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
      }
      
      .payment-forms {
        position: relative;
        min-height: 120px;
      }
      
      .payment-form {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      
      .payment-form.active {
        display: block;
      }
      
      .payment-form .row {
        margin-top: 0;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* Mobile optimizations */
      @media (max-width: 480px) {
        .selector-tabs {
          gap: 6px;
          padding: 6px;
        }
        .tab-button {
          padding: 16px 8px;
          min-height: 80px;
        }
        .tab-icon {
          font-size: 24px;
        }
        .tab-label {
          font-size: 10px;
        }
        .wrap {
          width: calc(100% - 16px);
        }
        .card {
          padding: 20px;
        }
      }

      .btn {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 16px 20px;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
      }
      .btn:hover { 
        background: var(--accent-hover); 
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
      }
      .btn:disabled { 
        opacity: 0.5; 
        cursor: not-allowed; 
        transform: none;
        box-shadow: none;
      }

      .hint { margin-top: 12px; color: var(--muted); font-size: 12px; text-align: center; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(0,0,0,.35);
        width: 100%;
        justify-content: center;
        box-sizing: border-box;
      }

      .status { margin-top: 14px; font-size: 13px; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); }
      .status.ok { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10); color: #dcfce7; }
      .status.err { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); color: #fee2e2; }
      .status.info { border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.10); color: #ffedd5; }

      .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(17,24,39,.25);
        border-top-color: rgba(17,24,39,.85);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <p class="title">Checkout</p>
        <p class="sub">Choose your payment method to complete payment.</p>

        <div class="amount">
          <div class="label">Amount</div>
          <div class="value" id="amountText">$0.00</div>
        </div>

        <!-- Payment Method Selection -->
        <div class="payment-selector">
          <div class="selector-tabs">
            <button class="tab-button active" id="card-tab" data-method="card">
              <div class="tab-icon">💳</div>
              <div class="tab-content">
                <div class="tab-label">Credit Card</div>
                <div class="tab-subtitle">Visa, Mastercard, Amex</div>
              </div>
              <div class="tab-radio"></div>
            </button>
            <button class="tab-button" id="applepay-tab" data-method="applepay">
              <div class="tab-icon">🍎</div>
              <div class="tab-content">
                <div class="tab-label">Apple Pay</div>
                <div class="tab-subtitle">Pay with Apple</div>
              </div>
              <div class="tab-radio"></div>
            </button>
            <button class="tab-button" id="googlepay-tab" data-method="googlepay">
              <div class="tab-icon">🅖</div>
              <div class="tab-content">
                <div class="tab-label">Google Pay</div>
                <div class="tab-subtitle">Pay with Google</div>
              </div>
              <div class="tab-radio"></div>
            </button>
            <button class="tab-button" id="cashapp-tab" data-method="cashapp">
              <div class="tab-icon">�</div>
              <div class="tab-content">
                <div class="tab-label">Cash App</div>
                <div class="tab-subtitle">Pay with Cash App</div>
              </div>
              <div class="tab-radio"></div>
            </button>
          </div>
          
          <div class="payment-forms">
            <div class="payment-form active" id="card-form">
              <div class="row" id="card-container"></div>
            </div>
            <div class="payment-form" id="applepay-form">
              <div class="row" id="apple-pay"></div>
            </div>
            <div class="payment-form" id="googlepay-form">
              <div class="row" id="google-pay"></div>
            </div>
            <div class="payment-form" id="cashapp-form">
              <div class="row" id="cash-app-pay"></div>
            </div>
          </div>
        </div>

        <button id="payBtn" class="btn" disabled>Pay</button>

        <div class="hint">
          <div class="pill" id="tokenPill">Waiting for secure session from the app…</div>
        </div>

        <div id="statusBox" class="status info" style="display:none;"></div>
      </div>
    </div>

    <script src="./checkout.js"></script>
  </body>
</html>
