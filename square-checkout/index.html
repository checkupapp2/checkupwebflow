<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout</title>

    <!-- Square Web Payments SDK (Sandbox) - Latest Version -->
    <script src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

    <style>
      :root {
        --bg: #0b0b0b;
        --card: #121212;
        --text: #ffffff;
        --muted: rgba(255,255,255,.65);
        --accent: #f59e0b;
        --danger: #ef4444;
        --ok: #22c55e;
        --border: rgba(255,255,255,.12);
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 50% 10%, rgba(245,158,11,.18), transparent),
                    radial-gradient(1000px 500px at 20% 80%, rgba(245,158,11,.10), transparent),
                    var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: grid;
        place-items: center;
      }

      .wrap { width: min(440px, calc(100% - 32px)); }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(0,0,0,.45);
      }

      .title { font-size: 18px; font-weight: 700; margin: 0 0 8px; letter-spacing: .2px; }
      .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.45; }

      .amount {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 14px;
        border-radius: 14px;
        background: rgba(0,0,0,.35);
        border: 1px solid rgba(255,255,255,.10);
        margin-bottom: 16px;
      }
      .amount .label { color: var(--muted); font-size: 13px; }
      .amount .value { font-size: 24px; font-weight: 800; }

      .row { margin-top: 12px; }
      #card-container {
        padding: 14px;
        border-radius: 14px;
        background: #ffffff;
      }

      .payment-selector { margin-top: 20px; }
      
      .selector-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        background: rgba(0,0,0,0.2);
        border-radius: 16px;
        padding: 6px;
      }
      
      .tab-button {
        flex: 1;
        background: transparent;
        border: none;
        border-radius: 12px;
        padding: 16px 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-family: inherit;
        min-height: 80px;
        position: relative;
        overflow: hidden;
      }
      
      .tab-button:hover {
        background: rgba(255,255,255,0.05);
        color: var(--text);
      }
      
      .tab-button.active {
        background: var(--accent);
        color: #000;
        box-shadow: 0 4px 12px rgba(245,158,11,0.3);
        transform: translateY(-1px);
      }
      
      .tab-button.active::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
        border-radius: 12px;
      }
      
      .tab-icon {
        font-size: 24px;
        line-height: 1;
      }
      
      .tab-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      
      .payment-forms {
        position: relative;
        min-height: 120px;
      }
      
      .payment-form {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      
      .payment-form.active {
        display: block;
      }
      
      .payment-form .row {
        margin-top: 0;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* Mobile optimizations */
      @media (max-width: 480px) {
        .tab-button {
          padding: 14px 8px;
          min-height: 70px;
        }
        .tab-icon {
          font-size: 20px;
        }
        .tab-label {
          font-size: 12px;
        }
      }

      .btn {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 700;
        background: var(--accent);
        color: #111827;
        cursor: pointer;
      }
      .btn[disabled] { opacity: .55; cursor: not-allowed; }

      .hint { margin-top: 12px; color: var(--muted); font-size: 12px; text-align: center; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(0,0,0,.35);
        width: 100%;
        justify-content: center;
        box-sizing: border-box;
      }

      .status { margin-top: 14px; font-size: 13px; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); }
      .status.ok { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10); color: #dcfce7; }
      .status.err { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); color: #fee2e2; }
      .status.info { border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.10); color: #ffedd5; }

      .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(17,24,39,.25);
        border-top-color: rgba(17,24,39,.85);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <p class="title">Checkout</p>
        <p class="sub">Choose your payment method to complete payment.</p>

        <div class="amount">
          <div class="label">Amount</div>
          <div class="value" id="amountText">$0.00</div>
        </div>

        <!-- Payment Method Selection -->
        <div class="payment-selector">
          <div class="selector-tabs">
            <button class="tab-button active" id="card-tab" data-method="card">
              <div class="tab-icon">💳</div>
              <div class="tab-label">Card</div>
            </button>
            <button class="tab-button" id="cashapp-tab" data-method="cashapp">
              <div class="tab-icon">📱</div>
              <div class="tab-label">Cash App</div>
            </button>
          </div>
          
          <div class="payment-forms">
            <div class="payment-form active" id="card-form">
              <div class="row" id="card-container"></div>
            </div>
            <div class="payment-form" id="cashapp-form">
              <div class="row" id="cash-app-pay"></div>
            </div>
          </div>
        </div>

        <button id="payBtn" class="btn" disabled>Pay</button>

        <div class="hint">
          <div class="pill" id="tokenPill">Waiting for secure session from the app…</div>
        </div>

        <div id="statusBox" class="status info" style="display:none;"></div>
      </div>
    </div>

    <script src="./checkout.js"></script>
  </body>
</html>
