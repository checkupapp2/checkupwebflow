<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open in CheckUp</title>
  <meta name="description" content="Open this shared CheckUp basketball link in the app or preview it on the web.">
  <link href="/css/share-fallback.css" rel="stylesheet" type="text/css">
</head>
<body>
  <main class="share-shell">
    <a class="brand-link" href="/" aria-label="CheckUp home">
      <img src="/images/62a28b59eb28845f6830afd8_checkupbasketballnetworklogo-p-500-1.png" alt="CheckUp">
    </a>

    <section id="fallback-card" class="share-card" aria-live="polite">
      <div class="media media-loading" id="media"></div>
      <div class="content">
        <p class="eyebrow" id="eyebrow">CheckUp link</p>
        <h1 id="title">Loading...</h1>
        <div class="meta-list" id="meta-list"></div>
        <p class="description" id="description"></p>
        <a class="primary-button" id="open-app" href="/">Open in CheckUp</a>
        <a class="secondary-link" href="/">Back to checkupbasketball.com</a>
      </div>
    </section>
  </main>

  <script type="module" src="/js/share-fallback.js?v=2"></script>
</body>
</html>
